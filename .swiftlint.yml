excluded:
  - .build
  - .git
  - .firebase
  - .github
  - .claude
  - public
  - MedalWall.xcodeproj

opt_in_rules:
  - closure_spacing
  - collection_alignment
  - contains_over_filter_is_empty
  - empty_collection_literal
  - empty_count
  - empty_string
  - explicit_init
  - first_where
  - last_where
  - modifier_order
  - operator_usage_whitespace
  - prefer_self_type_over_type_of_self
  - redundant_nil_coalescing
  - redundant_type_annotation
  - sorted_imports
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - vertical_whitespace_closing_braces
  - yoda_condition

disabled_rules:
  - trailing_whitespace
  - opening_brace

line_length:
  warning: 100
  error: 150
  ignores_comments: true
  ignores_urls: true

identifier_name:
  min_length:
    warning: 2
  excluded:
    - id

type_body_length:
  warning: 300
  error: 400

file_length:
  warning: 500
  error: 800

function_body_length:
  warning: 65
  error: 100

cyclomatic_complexity:
  warning: 15
  error: 20

nesting:
  type_level:
    warning: 2

custom_rules:
  mark_no_blank_line_after:
    name: "No blank line after MARK"
    regex: '(// MARK: -[^\n]*)\n\n'
    message: "Remove the blank line after // MARK: comments"
    severity: warning
