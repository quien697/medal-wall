name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Build & Test
    runs-on: macos-15

    env:
      # Pin to a specific Xcode version so CI uses the same toolchain as local development.
      # macos-15 runners ship with an older Xcode by default; without this the build would
      # use a different Swift/SDK version than the project targets.
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache SPM packages
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Build
        run: |
          # CODE_SIGNING_ALLOWED=NO: CI runners have no signing identity, so code signing must be disabled.
          # xcpretty: formats xcodebuild's verbose output into readable pass/fail lines.
          xcodebuild build \
            -project MedalWall.xcodeproj \
            -scheme MedalWall \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest' \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty

      - name: Test
        run: |
          xcodebuild test \
            -project MedalWall.xcodeproj \
            -scheme MedalWall \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest' \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty

      - name: Upload test results
        # Runs even when the previous step fails so test results are always available for debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: TestResults.xcresult
