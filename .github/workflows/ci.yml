name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Build & Test
    runs-on: macos-15

    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache SPM packages
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Write stub GoogleService-Info.plist
        run: |
          cat > MedalWall/GoogleService-Info.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>API_KEY</key><string>stub</string>
              <key>BUNDLE_ID</key><string>com.TsungHsun.MedalWall</string>
              <key>GOOGLE_APP_ID</key><string>1:000000000000:ios:0000000000000000000000</string>
              <key>GCM_SENDER_ID</key><string>000000000000</string>
              <key>PROJECT_ID</key><string>stub</string>
              <key>IS_ADS_ENABLED</key><false/>
              <key>IS_ANALYTICS_ENABLED</key><false/>
              <key>IS_GCM_ENABLED</key><true/>
              <key>IS_SIGNIN_ENABLED</key><true/>
          </dict>
          </plist>
          EOF

      - name: Build
        run: |
          xcodebuild build \
            -project MedalWall.xcodeproj \
            -scheme MedalWall \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest' \
            CODE_SIGNING_ALLOWED=NO

      - name: Test
        run: |
          xcodebuild test \
            -project MedalWall.xcodeproj \
            -scheme MedalWall \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest' \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: TestResults.xcresult
          if-no-files-found: ignore
