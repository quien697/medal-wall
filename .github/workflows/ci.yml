name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Build & Test
    runs-on: macos-26

    env:
      # Pin to a specific Xcode version so the build does not change when the image's default
      # does. The quien697 packages (TimePicker, CropImage, PhotoViewer, CachedAsyncImage)
      # declare swift-tools-version 6.3, so Xcode must ship Swift 6.3 or later (Xcode 26.4+):
      # macos-15 tops out at Xcode 26.3 (Swift 6.2.4) and fails package resolution. Local
      # development is on Xcode 27, which Actions offers only as a preview image (`xcode-27`).
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check formatting
        run: |
          # --strict: without it findings are only warnings and the command exits 0, so a
          # misformatted file would sail through CI. A config swift-format cannot read also
          # exits non-zero here, which is how this step earns its keep: formatting was
          # previously enforced only by the local pre-commit hook, which is untracked and
          # ignores the formatter's exit status.
          swift format lint --recursive --parallel --strict .

      - name: Install SwiftLint
        run: |
          # The arm64 runner images ship without SwiftLint, so `swiftlint` would exit 127.
          # Pinned to the local version so a rule added upstream cannot fail here before it
          # fails on a developer's machine.
          curl -sSfL -o "$RUNNER_TEMP/swiftlint.zip" \
            https://github.com/realm/SwiftLint/releases/download/0.65.1/portable_swiftlint.zip
          unzip -q "$RUNNER_TEMP/swiftlint.zip" -d "$RUNNER_TEMP/swiftlint"
          echo "$RUNNER_TEMP/swiftlint" >> "$GITHUB_PATH"

      - name: Lint
        run: |
          # --strict: most rules in .swiftlint.yml are warnings, and SwiftLint exits 0 on
          # warnings alone, so without this the step would report violations and still pass.
          # github-actions-logging: violations appear as annotations on the PR diff.
          swiftlint lint --strict --reporter github-actions-logging

      - name: Cache SPM packages
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Build
        run: |
          # CODE_SIGNING_ALLOWED=NO: CI runners have no signing identity, so code signing must be disabled.
          # xcpretty: formats xcodebuild's verbose output into readable pass/fail lines.
          # pipefail: the default shell is `bash -e` without it, so the step took xcpretty's exit
          # status and passed even when xcodebuild failed.
          set -o pipefail
          xcodebuild build \
            -project MedalWall.xcodeproj \
            -scheme MedalWall \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest' \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty

      - name: Test
        run: |
          set -o pipefail
          xcodebuild test \
            -project MedalWall.xcodeproj \
            -scheme MedalWall \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest' \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty

      - name: Upload test results
        # Runs even when the previous step fails so test results are always available for debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: TestResults.xcresult
